[project]
name = "valetax-support-studio"
version = "0.1.0"
description = "Human-reviewed support co-pilot for the Valetax take-home case"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "beautifulsoup4>=4.12,<5"]

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
